<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data:;
    connect-src 'self' https://rdxlvebvwjzfmzvguqaf.supabase.co;
    base-uri 'self';
    form-action 'self';
  ">
  <title>NiNi Sushi — Склад (админ)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Админка склада: локальные стили поверх переменных сайта ---- */
    body{ background:var(--bg-soft); font-family:var(--font-body); color:var(--ink); }
    .admin{ max-width:760px; margin:0 auto; padding:18px 16px 60px; }

    .admin__head{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:18px;
    }
    .admin__title{ font-family:var(--font-disp); font-weight:800; font-size:22px; }
    .admin__title span{ color:var(--coral); }
    .admin__user{ font-size:13px; color:var(--muted); margin-right:auto; }

    .card-box{
      background:#fff; border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:18px;
    }

    /* центрированная карточка входа */
    .login-wrap{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
    .login-wrap .card-box{ width:100%; max-width:380px; }
    .login-wrap .admin__title{ text-align:center; margin-bottom:6px; }
    .login-sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:14px; }

    /* таблица остатков */
    .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.stock{ width:100%; border-collapse:collapse; font-size:15px; }
    table.stock th, table.stock td{ padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
    table.stock th{ font-family:var(--font-disp); font-weight:700; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
    table.stock td.num, table.stock th.num{ text-align:right; }
    table.stock tr.is-low td{ background:#FFECEC; }
    table.stock tr.is-low .stock-val{ color:var(--coral); font-weight:800; }
    .stock-empty{ text-align:center; color:var(--muted); padding:24px 0; }

    .badge-low{ display:inline-block; margin-left:6px; font-size:11px; font-weight:800; color:#fff; background:var(--coral); padding:2px 7px; border-radius:999px; vertical-align:middle; }

    .hidden{ display:none !important; }
    .center-load{ text-align:center; color:var(--muted); padding:24px 0; display:flex; gap:10px; align-items:center; justify-content:center; }

    /* danger-кнопка (удаление) */
    .btn--danger{ background:#fff; color:var(--coral); border:1.5px solid var(--coral); box-shadow:none; }
    .btn--danger:hover{ background:var(--coral); color:#fff; }

    /* ---- Калькуляция ---- */
    .calc-top{ display:flex; justify-content:flex-end; margin-bottom:10px; }
    .dish-form{ margin-bottom:16px; }
    .dish-form__actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .dish-form__actions .btn{ margin-top:0; }
    .dish-form__actions #dishDelete{ margin-left:auto; }

    .dish-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
    .dish-card__head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .dish-card__name{ font-family:var(--font-disp); font-weight:800; font-size:17px; }
    .dish-card__meta{ font-size:13px; color:var(--muted); margin-top:2px; }
    .dish-card__meta .off{ color:var(--coral); font-weight:700; }
    .dish-card__edit{ flex:none; padding:8px 16px; font-size:14px; }

    .recipe-list{ list-style:none; margin:12px 0 0; padding:12px 0 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
    .recipe-row{ display:flex; align-items:center; gap:10px; }
    .recipe-row__name{ flex:1; font-weight:600; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .recipe-row__amount{ width:96px; flex:none; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); text-align:right; }
    .recipe-row__amount:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .recipe-row__unit{ width:48px; flex:none; font-size:13px; color:var(--muted); }
    .recipe-row__del{ flex:none; width:30px; height:30px; border-radius:8px; color:var(--coral); font-size:16px; line-height:1; background:var(--coral-soft); }
    .recipe-empty{ color:var(--muted); font-size:13px; margin:12px 0 0; padding-top:12px; border-top:1px solid var(--line); }

    .recipe-add{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .recipe-add__sel{ flex:1; min-width:140px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); }
    .recipe-add__amt{ width:96px; flex:none; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); text-align:right; }
    .recipe-add .btn{ margin-top:0; padding:9px 16px; font-size:14px; }

    @media (max-width:480px){
      .admin__title{ font-size:19px; }
      table.stock th, table.stock td{ padding:10px 8px; font-size:14px; }
    }
  </style>
</head>
<body>
  <div class="admin">

    <!-- ===== ВХОД ===== -->
    <section id="loginView" class="login-wrap hidden">
      <div class="card-box">
        <div class="admin__title">NiNi <span>Sushi</span> · Склад</div>
        <p class="login-sub">Вход для персонала</p>
        <div class="form">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
          <label for="password">Пароль</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          <button id="loginBtn" class="btn btn--primary btn--full">Войти</button>
          <p id="loginNote" class="form__note"></p>
        </div>
      </div>
    </section>

    <!-- ===== СКЛАД ===== -->
    <section id="appView" class="hidden">
      <div class="admin__head">
        <div class="admin__title">NiNi <span>Sushi</span> · Склад</div>
        <span id="userEmail" class="admin__user"></span>
        <button id="logoutBtn" class="btn btn--ghost">Выйти</button>
      </div>

      <div class="tabs">
        <button id="tabStock"  class="tabs__btn is-active" data-tab="stock">Остатки</button>
        <button id="tabIncome" class="tabs__btn"           data-tab="income">Приход</button>
        <button id="tabCalc"   class="tabs__btn"           data-tab="calc">Калькуляция</button>
      </div>

      <!-- Остатки -->
      <div id="panelStock" class="card-box">
        <div id="stockBody">
          <div class="center-load"><span class="spinner"></span> Загрузка…</div>
        </div>
      </div>

      <!-- Приход -->
      <div id="panelIncome" class="card-box hidden">
        <div class="form">
          <label for="incIngredient">Ингредиент</label>
          <select id="incIngredient"></select>
          <label for="incAmount">Количество</label>
          <input id="incAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
          <label for="incNote">Примечание (необязательно)</label>
          <input id="incNote" type="text" placeholder="напр. поставка от …">
          <button id="incSubmit" class="btn btn--primary btn--full">Добавить приход</button>
          <p id="incNoteMsg" class="form__note"></p>
        </div>
      </div>

      <!-- Калькуляция -->
      <div id="panelCalc" class="hidden">
        <div class="calc-top">
          <button id="addDishBtn" class="btn btn--primary">＋ Блюдо</button>
        </div>
        <p id="calcNote" class="form__note"></p>

        <!-- форма блюда (добавить / изменить) -->
        <div id="dishForm" class="card-box dish-form hidden">
          <div class="form">
            <label for="dishCode">Код</label>
            <input id="dishCode" type="text" placeholder="напр. R-01">
            <label for="dishName">Название *</label>
            <input id="dishName" type="text" placeholder="Название блюда">
            <label for="dishCategory">Категория</label>
            <input id="dishCategory" type="text" placeholder="напр. Роллы">
            <label for="dishPrice">Цена</label>
            <input id="dishPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
            <div class="dish-form__actions">
              <button id="dishSave" class="btn btn--primary">Сохранить</button>
              <button id="dishCancel" class="btn btn--ghost">Отмена</button>
              <button id="dishDelete" class="btn btn--danger hidden">Удалить блюдо</button>
            </div>
            <p id="dishNote" class="form__note"></p>
          </div>
        </div>

        <div id="calcBody">
          <div class="center-load"><span class="spinner"></span> Загрузка…</div>
        </div>
      </div>
    </section>

  </div>

  <script src="js/admin.js"></script>
</body>
</html>
