<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://rdxlvebvwjzfmzvguqaf.supabase.co;
    base-uri 'self';
    form-action 'self';
  ">
  <title>NiNi Sushi — Warehouse (admin)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ---- Админка склада: локальные стили поверх переменных сайта ---- */
    body{ background:var(--bg-soft); font-family:var(--font-body); color:var(--ink); }

    /* убрать стрелки-степперы у числовых полей (только ручной ввод) */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
    input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
    .admin{ max-width:760px; margin:0 auto; padding:18px 16px 60px; }

    .admin__head{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; margin-bottom:18px;
    }
    .admin__title{ font-family:var(--font-disp); font-weight:800; font-size:22px; }
    .admin__title span{ color:var(--coral); }
    .admin__user{ font-size:13px; color:var(--muted); margin-right:auto; }

    .card-box{
      background:#fff; border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:18px;
    }

    /* центрированная карточка входа */
    .login-wrap{ min-height:80vh; display:flex; align-items:center; justify-content:center; }
    .login-wrap .card-box{ width:100%; max-width:380px; }
    .login-wrap .admin__title{ text-align:center; margin-bottom:6px; }
    .login-sub{ text-align:center; color:var(--muted); font-size:14px; margin-bottom:14px; }

    /* таблица остатков */
    .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    table.stock{ width:100%; border-collapse:collapse; font-size:15px; }
    table.stock th, table.stock td{ padding:11px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
    table.stock th{ font-family:var(--font-disp); font-weight:700; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; }
    table.stock td.num, table.stock th.num{ text-align:right; }
    table.stock tr.is-low td{ background:#FFECEC; }
    table.stock tr.is-low .stock-val{ color:var(--coral); font-weight:800; }
    .stock-edit{ width:96px; padding:7px 9px; border:1px solid var(--line); border-radius:9px; font-family:inherit; font-size:14px; background:var(--bg-soft); text-align:right; }
    .stock-edit:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .stock-edit.low{ color:var(--coral); font-weight:800; }
    .stock-empty{ text-align:center; color:var(--muted); padding:24px 0; }

    .badge-low{ display:inline-block; margin-left:6px; font-size:11px; font-weight:800; color:#fff; background:var(--coral); padding:2px 7px; border-radius:999px; vertical-align:middle; }

    .hidden{ display:none !important; }
    .center-load{ text-align:center; color:var(--muted); padding:24px 0; display:flex; gap:10px; align-items:center; justify-content:center; }

    /* danger-кнопка (удаление) */
    .btn--danger{ background:#fff; color:var(--coral); border:1.5px solid var(--coral); box-shadow:none; }
    .btn--danger:hover{ background:var(--coral); color:#fff; }

    /* ---- Калькуляция ---- */
    .calc-top{ display:flex; justify-content:flex-end; margin-bottom:10px; }
    .dish-form{ margin-bottom:16px; }
    .dish-form__actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    .dish-form__actions .btn{ margin-top:0; }
    .dish-form__actions #dishDelete{ margin-left:auto; }

    .dish-card{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
    .dish-card__head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .dish-card__name{ font-family:var(--font-disp); font-weight:800; font-size:17px; }
    .dish-card__meta{ font-size:13px; color:var(--muted); margin-top:2px; }
    .dish-card__meta .off{ color:var(--coral); font-weight:700; }
    .dish-card__edit{ flex:none; padding:8px 16px; font-size:14px; }

    .recipe-list{ list-style:none; margin:12px 0 0; padding:12px 0 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
    .recipe-row{ display:flex; align-items:center; gap:10px; }
    .recipe-row__name{ flex:1; font-weight:600; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .recipe-row__amount{ width:96px; flex:none; padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); text-align:right; }
    .recipe-row__amount:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .recipe-row__unit{ width:48px; flex:none; font-size:13px; color:var(--muted); }
    .recipe-row__del{ flex:none; width:30px; height:30px; border-radius:8px; color:var(--coral); font-size:16px; line-height:1; background:var(--coral-soft); }
    .recipe-empty{ color:var(--muted); font-size:13px; margin:12px 0 0; padding-top:12px; border-top:1px solid var(--line); }

    .recipe-add{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .recipe-add__sel{ flex:1; min-width:140px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); }
    .recipe-add__amt{ width:96px; flex:none; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); text-align:right; }
    .recipe-add .btn{ margin-top:0; padding:9px 16px; font-size:14px; }

    /* ---- Фото-приход накладной ---- */
    .invoice-box{ margin-top:16px; }
    .invoice-head{ font-family:var(--font-disp); font-weight:800; font-size:16px; margin-bottom:12px; }
    .invoice-upload{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .invoice-upload input[type=file]{ flex:1; min-width:170px; font-size:14px; }
    .invoice-upload .btn{ margin-top:0; padding:10px 18px; font-size:14px; }

    .inv-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:14px; }
    table.inv-table{ width:100%; border-collapse:collapse; font-size:14px; }
    table.inv-table th, table.inv-table td{ padding:6px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    table.inv-table th{ font-family:var(--font-disp); font-weight:700; font-size:12px; color:var(--muted); text-transform:uppercase; white-space:nowrap; }
    table.inv-table input, table.inv-table select{ width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; background:var(--bg-soft); }
    table.inv-table input:focus, table.inv-table select:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .inv-name{ min-width:140px; }
    .inv-num{ width:82px; text-align:right; }
    .inv-unit{ width:66px; }
    .inv-ing{ min-width:150px; }
    .inv-submit-row{ margin-top:14px; }
    .inv-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .inv-actions .btn{ margin-top:0; flex:1; min-width:130px; }
    table.inv-table td:last-child{ width:38px; text-align:center; }
    .inv-del{ width:28px; height:28px; border-radius:50%; border:1.5px solid var(--coral); color:var(--coral); background:#fff; font-size:16px; line-height:1; font-weight:700; transition:.15s; }
    .inv-del:hover{ background:var(--coral); color:#fff; }

    /* ---- Касса ---- */
    .cash-balance-box{ margin-bottom:14px; }
    .cash-period{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; font-family:inherit; font-size:15px; background:var(--bg-soft); margin-bottom:14px; }
    .cash-period:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .cash-metrics{ display:flex; gap:10px; }
    .cash-metric{ flex:1; min-width:0; background:var(--bg-soft); border-radius:12px; padding:12px 8px; text-align:center; }
    .cash-metric__label{ display:block; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em; font-weight:700; margin-bottom:5px; }
    .cash-metric__val{ font-family:var(--font-disp); font-weight:800; font-size:17px; white-space:nowrap; }
    .cash-metric__val.pos{ color:#3DBB6B; }
    .cash-metric__val.neg{ color:var(--coral); }
    .cash-metric__val.is-neg{ color:var(--coral); }
    .cash-overall{ margin-top:12px; font-size:13px; color:var(--muted); text-align:center; }
    .cash-overall strong{ color:var(--ink); font-weight:800; }
    .cash-overall strong.is-neg{ color:var(--coral); }
    .cash-top{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; margin-bottom:10px; }
    .cash-top .btn{ padding:9px 16px; font-size:14px; }
    .cash-form{ margin-bottom:16px; }

    .cash-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
    .cash-row{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
    .cash-row:last-child{ border-bottom:none; }
    .cash-row__main{ flex:1; min-width:0; }
    .cash-row__top{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
    .cash-row__src{ font-weight:700; font-size:14px; }
    .cash-row__ord{ font-size:12px; color:var(--muted); }
    .cash-row__note{ font-size:13px; color:var(--muted); margin-top:2px; word-break:break-word; }
    .cash-row__date{ font-size:12px; color:var(--muted); margin-top:2px; }
    .cash-row__sum{ flex:none; font-family:var(--font-disp); font-weight:800; font-size:16px; white-space:nowrap; }
    .cash-row__sum.pos{ color:#3DBB6B; }
    .cash-row__sum.neg{ color:var(--coral); }
    .cash-empty{ text-align:center; color:var(--muted); padding:24px 0; }

    .cash-note-edit{ width:100%; margin-top:4px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; background:var(--bg-soft); }
    .cash-note-edit:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .cash-amt-edit{ flex:none; width:120px; padding:7px 9px; border:1px solid var(--line); border-radius:9px; font-family:var(--font-disp); font-weight:800; font-size:15px; background:var(--bg-soft); text-align:right; }
    .cash-amt-edit:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .cash-amt-edit.pos{ color:#3DBB6B; }
    .cash-amt-edit.neg{ color:var(--coral); }
    .cash-del{ flex:none; width:28px; height:28px; border-radius:50%; border:1.5px solid var(--coral); color:var(--coral); background:#fff; font-size:16px; line-height:1; font-weight:700; transition:.15s; }
    .cash-del:hover{ background:var(--coral); color:#fff; }

    /* ---- Движения ---- */
    .moves-filters{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; align-items:center; }
    .moves-filters select{ flex:1; min-width:130px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); }
    .moves-filters .btn{ margin-top:0; padding:9px 16px; font-size:14px; }
    .moves-date{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
    .moves-date input{ padding:8px 9px; border:1px solid var(--line); border-radius:10px; font-family:inherit; font-size:14px; background:var(--bg-soft); }
    .moves-date input:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .moves-total{ margin-bottom:12px; padding:11px 14px; border:1px solid var(--coral); background:var(--coral-soft); border-radius:12px; font-family:var(--font-disp); font-weight:800; font-size:15px; color:var(--coral-dark); }
    table.moves{ width:100%; border-collapse:collapse; font-size:14px; }
    table.moves th, table.moves td{ padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; vertical-align:top; }
    table.moves th{ font-family:var(--font-disp); font-weight:700; font-size:12px; color:var(--muted); text-transform:uppercase; }
    table.moves td.num{ text-align:right; }
    .mv-type{ font-weight:800; }
    .mv-type.in{ color:#3DBB6B; }
    .mv-type.out{ color:var(--coral); }
    .mv-type.adjust{ color:var(--muted); }
    .mv-note{ color:var(--muted); max-width:220px; white-space:normal; word-break:break-word; }
    .moves-empty{ text-align:center; color:var(--muted); padding:24px 0; }

    @media (max-width:560px){
      .admin{ padding:12px 10px 48px; }
      .card-box{ padding:14px; border-radius:14px; }
      .admin__title{ font-size:18px; }
      .cash-balance__val{ font-size:26px; }

      /* шапка: email переносим на отдельную строку */
      .admin__head{ flex-wrap:wrap; gap:8px; margin-bottom:14px; }
      .admin__user{ order:3; width:100%; margin:0; }

      /* вкладки: горизонтальный скролл вместо сжатия/обрезки */
      .tabs{ overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; scrollbar-width:none; }
      .tabs::-webkit-scrollbar{ display:none; }
      .tabs__btn{ flex:0 0 auto; white-space:nowrap; padding:10px 14px; font-size:14px; }

      /* таблица остатков плотнее */
      table.stock th, table.stock td{ padding:9px 8px; font-size:13.5px; }
      .stock-edit{ width:78px; }

      /* накладная — уже колонки */
      table.inv-table th, table.inv-table td{ padding:5px 4px; }
      .inv-name{ min-width:104px; }
      .inv-ing{ min-width:118px; }

      /* калькуляция + касса компактнее */
      .dish-card{ padding:14px; }
      .recipe-row__amount{ width:78px; }
      .cash-amt-edit{ width:104px; font-size:14px; }

      /* поля основных форм ≥16px — iOS не зумит при фокусе */
      .form input, .form select, .form textarea{ font-size:16px; }
    }
  </style>
</head>
<body>
  <div class="admin">

    <!-- ===== LOGIN ===== -->
    <section id="loginView" class="login-wrap hidden">
      <div class="card-box">
        <div class="admin__title">NiNi <span>Sushi</span> · Warehouse</div>
        <p class="login-sub">Staff login</p>
        <div class="form">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          <button id="loginBtn" class="btn btn--primary btn--full">Log in</button>
          <p id="loginNote" class="form__note"></p>
        </div>
      </div>
    </section>

    <!-- ===== WAREHOUSE ===== -->
    <section id="appView" class="hidden">
      <div class="admin__head">
        <div class="admin__title">NiNi <span>Sushi</span> · Warehouse</div>
        <span id="userEmail" class="admin__user"></span>
        <button id="logoutBtn" class="btn btn--ghost">Log out</button>
      </div>

      <div class="tabs">
        <button id="tabStock"  class="tabs__btn is-active" data-tab="stock">Stock</button>
        <button id="tabIncome" class="tabs__btn"           data-tab="income">Income</button>
        <button id="tabCalc"   class="tabs__btn"           data-tab="calc">Recipes</button>
        <button id="tabCash"   class="tabs__btn"           data-tab="cash">Cash</button>
        <button id="tabMoves"  class="tabs__btn"           data-tab="moves">Movements</button>
      </div>

      <!-- Stock -->
      <div id="panelStock" class="card-box">
        <div id="stockBody">
          <div class="center-load"><span class="spinner"></span> Loading…</div>
        </div>
        <p id="stockNote" class="form__note"></p>
      </div>

      <!-- Income -->
      <div id="panelIncome" class="hidden">

        <!-- Manual income -->
        <div class="card-box">
          <div class="form">
            <label for="incIngredient">Ingredient</label>
            <select id="incIngredient"></select>
            <div id="incNewFields" class="hidden">
              <label for="incNewName">New ingredient name *</label>
              <input id="incNewName" type="text" placeholder="e.g. Wasabi">
              <label for="incNewUnit">Unit</label>
              <select id="incNewUnit">
                <option value="g">g</option>
                <option value="pcs">pcs</option>
              </select>
            </div>
            <label for="incAmount">Quantity</label>
            <input id="incAmount" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
            <label for="incPrice">Purchase price (₫) (optional)</label>
            <input id="incPrice" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
            <label for="incNote">Note (optional)</label>
            <input id="incNote" type="text" placeholder="e.g. delivery from …">
            <button id="incSubmit" class="btn btn--primary btn--full">Add income</button>
            <p id="incNoteMsg" class="form__note"></p>
          </div>
        </div>

        <!-- Invoice photo income -->
        <div class="card-box invoice-box">
          <div class="invoice-head">📷 Upload invoice</div>
          <div class="invoice-upload">
            <input id="invFile" type="file" accept="image/*,.heic,.heif">
            <button id="invRecognize" class="btn btn--primary">Recognize</button>
          </div>
          <p id="invNote" class="form__note"></p>
          <div id="invResult"></div>
        </div>
      </div>

      <!-- Recipes -->
      <div id="panelCalc" class="hidden">
        <div class="calc-top">
          <button id="addDishBtn" class="btn btn--primary">＋ Dish</button>
        </div>
        <p id="calcNote" class="form__note"></p>

        <!-- dish form (add / edit) -->
        <div id="dishForm" class="card-box dish-form hidden">
          <div class="form">
            <label for="dishCode">Code</label>
            <input id="dishCode" type="text" placeholder="e.g. R-01">
            <label for="dishName">Name *</label>
            <input id="dishName" type="text" placeholder="Dish name">
            <label for="dishCategory">Category</label>
            <input id="dishCategory" type="text" placeholder="e.g. Rolls">
            <label for="dishPrice">Price</label>
            <input id="dishPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="0">
            <div class="dish-form__actions">
              <button id="dishSave" class="btn btn--primary">Save</button>
              <button id="dishCancel" class="btn btn--ghost">Cancel</button>
              <button id="dishDelete" class="btn btn--danger hidden">Delete dish</button>
            </div>
            <p id="dishNote" class="form__note"></p>
          </div>
        </div>

        <div id="calcBody">
          <div class="center-load"><span class="spinner"></span> Loading…</div>
        </div>
      </div>

      <!-- Cash -->
      <div id="panelCash" class="hidden">
        <div class="card-box cash-balance-box">
          <select id="cashPeriod" class="cash-period">
            <option value="all">All time</option>
            <option value="current">Current month</option>
          </select>

          <div class="cash-metrics">
            <div class="cash-metric">
              <span class="cash-metric__label">Income</span>
              <span id="cashIncome" class="cash-metric__val pos">…</span>
            </div>
            <div class="cash-metric">
              <span class="cash-metric__label">Expense</span>
              <span id="cashExpense" class="cash-metric__val neg">…</span>
            </div>
            <div class="cash-metric">
              <span class="cash-metric__label">Period total</span>
              <span id="cashPeriodTotal" class="cash-metric__val">…</span>
            </div>
          </div>

          <div class="cash-overall">Total balance (all time): <strong id="cashBalance">…</strong></div>
        </div>

        <div class="cash-top">
          <button id="cashAddBtn" class="btn btn--ghost">＋ Manual entry</button>
          <button id="cashRefreshBtn" class="btn btn--ghost">Refresh</button>
        </div>
        <p id="cashNote" class="form__note"></p>

        <!-- manual entry form -->
        <div id="cashForm" class="card-box cash-form hidden">
          <div class="form">
            <label for="cashAmount">Amount (₫) — «+» income, «−» expense</label>
            <input id="cashAmount" type="number" step="1" inputmode="numeric" placeholder="e.g. -50000">
            <label for="cashOpNote">Note</label>
            <input id="cashOpNote" type="text" placeholder="what it's for">
            <div class="dish-form__actions">
              <button id="cashSave" class="btn btn--primary">Save</button>
              <button id="cashCancel" class="btn btn--ghost">Cancel</button>
            </div>
            <p id="cashFormNote" class="form__note"></p>
          </div>
        </div>

        <div id="cashBody">
          <div class="center-load"><span class="spinner"></span> Loading…</div>
        </div>
      </div>

      <!-- Движения (история склада) -->
      <div id="panelMoves" class="card-box hidden">
        <div class="moves-filters">
          <select id="movesType">
            <option value="">All types</option>
            <option value="in">Income</option>
            <option value="out">Expense</option>
            <option value="adjust">Adjustment</option>
          </select>
          <select id="movesIng">
            <option value="">All ingredients</option>
          </select>
          <label class="moves-date">from <input type="date" id="movFrom"></label>
          <label class="moves-date">to <input type="date" id="movTo"></label>
