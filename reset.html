<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiNi Sushi</title>
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --coral:#FB4B23; --coral-dark:#E03A14; --coral-soft:#FFE9E2;
      --ink:#1F1B18; --muted:#8A817C; --line:#EFE7E1; --bg-soft:#FBF6F2;
      --font-disp:'Baloo 2', system-ui, sans-serif;
      --font-body:'Nunito Sans', system-ui, sans-serif;
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:var(--font-body); color:var(--ink);
      background:
        radial-gradient(800px 360px at 80% -10%, var(--coral-soft), transparent 60%),
        linear-gradient(180deg, #fff 0%, var(--bg-soft) 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .card{
      background:#fff; width:100%; max-width:400px; border-radius:22px;
      padding:34px 28px; box-shadow:0 18px 50px rgba(251,75,35,.14); text-align:center;
    }
    .langbar{ display:flex; justify-content:center; gap:6px; margin-bottom:18px; }
    .langbar button{
      background:var(--bg-soft); color:var(--muted); border:none; cursor:pointer;
      font-family:var(--font-disp); font-weight:700; font-size:13px;
      padding:6px 11px; border-radius:9px; transition:.15s;
    }
    .langbar button.is-active{ background:var(--coral); color:#fff; }
    .langbar button:hover{ color:var(--coral); }
    .langbar button.is-active:hover{ color:#fff; }
    .logo{ width:84px; height:84px; border-radius:50%; box-shadow:0 8px 22px rgba(0,0,0,.12); margin:0 auto 18px; display:block; }
    h1{ font-family:var(--font-disp); font-weight:800; font-size:26px; margin-bottom:6px; }
    .sub{ color:var(--muted); font-size:14px; margin-bottom:22px; }
    label{ display:block; text-align:left; font-weight:700; font-size:13px; margin-bottom:6px; }
    input{
      width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:12px;
      font-family:inherit; font-size:15px; background:var(--bg-soft); transition:.15s;
    }
    input:focus{ outline:none; border-color:var(--coral); background:#fff; }
    .btn{
      width:100%; margin-top:18px; background:var(--coral); color:#fff; border:none; cursor:pointer;
      border-radius:999px; padding:14px; font-family:var(--font-disp); font-weight:700; font-size:16px;
      transition:.15s;
    }
    .btn:hover{ background:var(--coral-dark); transform:translateY(-2px); }
    .btn:disabled{ opacity:.6; cursor:default; transform:none; }
    .note{ font-size:14px; margin-top:16px; min-height:20px; }
    .note.is-ok{ color:#3DBB6B; font-weight:700; }
    .note.is-error{ color:var(--coral); }
    .home-link{
      display:inline-block; margin-top:14px; color:var(--coral); font-weight:700;
      font-family:var(--font-disp); text-decoration:none;
    }
    .home-link:hover{ text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="langbar" id="langbar">
      <button data-lang="ua">UA</button>
      <button data-lang="ru">RU</button>
      <button data-lang="en">EN</button>
      <button data-lang="vn">VN</button>
    </div>
    <img src="img/logo.jpg" alt="NiNi Sushi" class="logo">
    <h1 id="title">Новый пароль</h1>
    <p class="sub" id="sub">Введите новый пароль для вашего аккаунта</p>

    <div id="formBox">
      <label for="newPassword" id="passLabel">Пароль</label>
      <input type="password" id="newPassword" autocomplete="new-password" placeholder="••••••••">
      <button class="btn" id="saveBtn">Сохранить</button>
    </div>

    <p class="note" id="note"></p>
    <a class="home-link" id="homeLink" href="index.html" style="display:none;">На главную</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL      = "https://wqovkezgzpwyyxavrrtv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Xhpgpka8R3sThsfqCDikhQ_DxpK9if0";

    // Supabase сам подхватит сессию восстановления из ссылки письма (detectSessionInUrl)
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ---------- Переводы ---------- */
    const I18N = {
      ua: { title:"Новий пароль", sub:"Введіть новий пароль для вашого акаунта", label:"Пароль",
            save:"Зберегти", success:"✅ Пароль змінено", home:"На головну",
            weak:"⚠️ Пароль має містити щонайменше 6 символів", err:"Помилка зміни пароля" },
      ru: { title:"Новый пароль", sub:"Введите новый пароль для вашего аккаунта", label:"Пароль",
            save:"Сохранить", success:"✅ Пароль изменён", home:"На главную",
            weak:"⚠️ Пароль должен содержать минимум 6 символов", err:"Ошибка смены пароля" },
      en: { title:"New password", sub:"Enter a new password for your account", label:"Password",
            save:"Save", success:"✅ Password changed", home:"Home",
            weak:"⚠️ Password must be at least 6 characters", err:"Failed to change password" },
      vn: { title:"Mật khẩu mới", sub:"Nhập mật khẩu mới cho tài khoản của bạn", label:"Mật khẩu",
            save:"Lưu", success:"✅ Đã đổi mật khẩu", home:"Trang chủ",
            weak:"⚠️ Mật khẩu phải có ít nhất 6 ký tự", err:"Không thể đổi mật khẩu" }
    };

    const note     = document.getElementById('note');
    const saveBtn  = document.getElementById('saveBtn');
    const input    = document.getElementById('newPassword');
    const formBox  = document.getElementById('formBox');
    const homeLink = document.getElementById('homeLink');

    let lang = detectLang();

    function detectLang(){
      const p = new URLSearchParams(location.search).get('lang');
      if(p && I18N[p]) return p;
      const n = (navigator.language || '').slice(0,2).toLowerCase();
      const map = { uk:'ua', ru:'ru', en:'en', vi:'vn' };
      return map[n] || 'ru';
    }

    function applyLang(l){
      lang = I18N[l] ? l : 'ru';
      const t = I18N[lang];
      document.documentElement.lang = (lang === 'ua' ? 'uk' : lang === 'vn' ? 'vi' : lang);
      document.getElementById('title').textContent = t.title;
      document.getElementById('sub').textContent = t.sub;
      document.getElementById('passLabel').textContent = t.label;
      saveBtn.textContent = t.save;
      homeLink.textContent = t.home;
      document.querySelectorAll('#langbar button').forEach(b=>{
        b.classList.toggle('is-active', b.dataset.lang === lang);
      });
    }

    document.querySelectorAll('#langbar button').forEach(b=>{
      b.addEventListener('click', ()=> applyLang(b.dataset.lang));
    });

    applyLang(lang);

    saveBtn.addEventListener('click', async ()=>{
      note.className = 'note';
      const t = I18N[lang];
      const pass = input.value;
      if(!pass || pass.length < 6){
        note.textContent = t.weak;
        note.classList.add('is-error');
        return;
      }

      saveBtn.disabled = true;
      try{
        const { error } = await supa.auth.updateUser({ password: pass });
        if(error) throw error;

        formBox.style.display = 'none';
        note.textContent = t.success;
        note.classList.add('is-ok');
        homeLink.style.display = 'inline-block';
      }catch(err){
        note.textContent = '❌ ' + (err.message || t.err);
        note.classList.add('is-error');
        saveBtn.disabled = false;
      }
    });

    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') saveBtn.click(); });
  </script>
</body>
</html>
